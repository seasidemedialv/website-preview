name: Deploy GitHub Pages

# Direct static deployment for virtuvespecpasutijuma.lv: 2026-07-29
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4

      - name: Check out static kitchen website
        uses: actions/checkout@v4
        with:
          repository: seasidemedialv/virtuvespecpasutijuma.lv
          ref: main
          path: source/virtuvespecpasutijuma
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site without a build step
        shell: bash
        run: |
          set -euo pipefail
          target="_site/virtuvespecpasutijuma"
          source="source/virtuvespecpasutijuma"
          mkdir -p "$target"
          cp index.html styles.css script.js .nojekyll _site/
          cp -R rigas-santehnikis _site/
          cp "$source/index.html" "$source/404.html" "$source/styles.css" "$source/script.js" "$source/favicon.svg" "$source/robots.txt" "$source/sitemap.xml" "$target/"
          cp -R "$source/public" "$target/"
          for page in \
            buj iebuvetas-virtuves ka-mes-stradajam kontakti mazas-virtuves \
            modernas-virtuves par-mums privatuma-politika realizetie-projekti \
            stura-un-l-veida-virtuves virtuves-ar-salu virtuves-cenas \
            virtuves-dizains-un-projektesana virtuves-fasades virtuves-furnitura \
            virtuves-iekartas-pec-pasutijuma virtuves-interjers \
            virtuves-izgatavosana virtuves-planosana virtuves-skapisi \
            virtuves-uzstadisana
          do
            cp -R "$source/$page" "$target/"
          done
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
